  function promptParts(){const sp=state.meta.species||SPECIES[0],role=state.meta.role||ROLES[0],hair=state.meta.hairColor,eyes=state.meta.eyeColors||[];return["masterpiece","best quality","1girl","adult woman","solo","full body","fantasy character design","Japanese light novel illustration",...sp.prompt,ROLE_EN[role.key],hair?`${COLOR_EN[hair.name]} hair`:"",state.meta.hairPrompt,...eyes.map(x=>`${COLOR_EN[x[0]]} eyes`),state.meta.weaponPrompt,state.meta.armorPrompt,state.meta.magicPrompt,state.filters.marks?"distinctive subtle body mark":"",state.filters.curse?"subtle magical curse markings":"","clean readable silhouette","coherent equipment"].filter(Boolean)}

  function summary(){return FIELDS.filter(enabled).map(f=>`${f.label}：${state.values[f.key]||"—"}${fieldMeta(f.key)?`\n  ${fieldMeta(f.key)}`:""}`).join("\n")}
  function render(){for(const f of FIELDS){const c=document.querySelector(`[data-key="${f.key}"]`);c.hidden=!enabled(f);if(c.hidden)continue;c.querySelector(".value").textContent=state.values[f.key]||"尚未生成";c.querySelector(".meta").textContent=fieldMeta(f.key);const b=c.querySelector("[data-lock]");b.classList.toggle("active",state.locked.has(f.key));b.textContent=state.locked.has(f.key)?"◆":"◇";const sw=c.querySelector(".swatches");sw.innerHTML="";let colors=[];if(f.key==="hair"&&state.meta.hairColor)colors=[state.meta.hairColor];if(f.key==="eyes")colors=(state.meta.eyeColors||[]).map(x=>({name:x[0],hex:x[1]}));for(const x of colors){const i=document.createElement("i");i.className="swatch";i.style.background=x.hex;i.title=`${x.name} ${x.hex}`;sw.append(i)}}document.querySelector("#summary").textContent=summary();document.querySelector("#seedLabel").textContent=state.seed?`生成批次 ${String(state.seed).slice(-6)}`:"";const pr=prompt();document.querySelector("#positive").value=pr.positive;document.querySelector("#negative").value=pr.negative;persist()}
  function persist(){localStorage.setItem("fantasy-persona-roller-v1",JSON.stringify({filters:state.filters,values:state.values,meta:state.meta,locked:[...state.locked],seed:state.seed,preset:state.preset}))}
  function restore(){try{const d=JSON.parse(localStorage.getItem("fantasy-persona-roller-v1"));if(!d)return;Object.assign(state.filters,defaults,d.filters||{});state.values=d.values||{};state.meta=d.meta||{};state.locked=new Set(d.locked||[]);state.seed=d.seed||0;state.preset=d.preset||"novelai"}catch{}}
  async function copy(t){await navigator.clipboard.writeText(t)}
  restore();buildControls();buildGrid();document.querySelector("#promptPreset").value=state.preset;document.querySelector("#rollAll").onclick=roll;document.querySelector("#copySummary").onclick=()=>copy(summary());document.querySelector("#unlockAll").onclick=()=>{state.locked.clear();render()};document.querySelector("#promptPreset").onchange=e=>{state.preset=e.target.value;render()};document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(document.querySelector(`#${b.dataset.copy}`).value));document.querySelector("#exportJson").onclick=()=>{const blob=new Blob([JSON.stringify({version:"fantasy-v1.0",generatedAt:new Date().toISOString(),filters:state.filters,character:state.values,details:state.meta,prompts:prompt()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`fantasy-persona-${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href)};if(!state.values.name)roll();else render();
</script></body></html>
