</head>

    function setFilter(key,value) {
      state.filters[key] = value;
      if (key === "finishingMode") updateFinishingLockDependency();
      if (["negativePersonality","bodyFeatures","healthConditions"].includes(key)) {
        const fieldKey = key;
        if (value && state.values.name) GENERATORS[fieldKey]();

          delete state.values[fieldKey];

          if (key === "negativePersonality") delete state.meta.negativePersonalityKeys;

    function normalizeHeightRange(changedKey) {
      let min = Math.round(Number(state.filters.heightMin));
      let max = Math.round(Number(state.filters.heightMax));
      if (!Number.isFinite(min)) min = 145;
      if (!Number.isFinite(max)) max = 185;
      min = Math.max(135,Math.min(210,min));
      max = Math.max(135,Math.min(210,max));
      if (min > max) {
        if (changedKey === "heightMin") max = min;
        else min = max;
      }
      state.filters.heightMin = min;
      state.filters.heightMax = max;
    }

      state.filters[key] = value;

    function weightedHeight(type) {
      normalizeHeightRange();
      const min = state.filters.heightMin;
      const max = state.filters.heightMax;
      const preferredCenter = (type.height[0] + type.height[1]) / 2;
      const center = Math.max(min,Math.min(max,preferredCenter));
      const spread = Math.max(4.5,(type.height[1] - type.height[0]) / 2.1);
      const candidates = [];
      let totalWeight = 0;
      for (let value = min; value <= max; value += 1) {
        const distance = (value - center) / spread;
        const weight = Math.exp(-.5 * distance * distance) + .012;
        totalWeight += weight;
        candidates.push([value,totalWeight]);
      }
      const target = Math.random() * totalWeight;
      return candidates.find(([,cumulative]) => target <= cumulative)?.[0] ?? Math.round(center);
    }

    function generateMeasurements() {
      let type = BODY_TYPES.find(item => item.key === state.meta.bodyTypeKey);

      }
      const height = weightedHeight(type);
      let bust = integer(type.bust);
      let waist = integer(type.waist);
      let hips = integer(type.hips);
      if (bust <= waist + 14) bust = waist + 15;
      if (hips <= waist + 18) hips = waist + 19;
      state.values.measurements = `身高 ${height} cm · B/W/H ${bust}/${waist}/${hips} cm`;

    function generatePersonality() {
      const targetCount = Number(chooseFilter("personalityCount", ["1","2","3"]));
      let selected;
      if (targetCount === 1) {
        selected = [pick(PERSONALITY_LAYERS.temperament)];
      } else if (targetCount === 2) {
        const base = pick(PERSONALITY_LAYERS.temperament);
        const expressions = PERSONALITY_LAYERS.expression.filter(tag => personalitiesCompatible(base,tag));
        selected = [base,pick(expressions)];
      } else {
        const compatibleTriples = [];
        PERSONALITY_LAYERS.temperament.forEach(base => {
          PERSONALITY_LAYERS.expression.filter(expression => personalitiesCompatible(base,expression)).forEach(expression => {
            const accents = PERSONALITY_LAYERS.accent.filter(accent => [base,expression].every(other => personalitiesCompatible(other,accent)));
            accents.forEach(accent => compatibleTriples.push([base,expression,accent]));
          });
        });
        selected = pick(compatibleTriples);
      }
      state.values.personality = selected.map(tag => tag.label).join(" × ");
      state.meta.personality = selected.map(tag => tag.detail).join("；");
      state.meta.personalityKeys = selected.map(tag => tag.key);

    function generateNegativePersonality() {
      const positiveByKey = new Map(Object.values(PERSONALITY_LAYERS).flat().map(tag => [tag.key,tag]));
      const positives = (state.meta.personalityKeys || []).map(key => positiveByKey.get(key)).filter(Boolean);
      const compatibleCandidates = NEGATIVE_PERSONALITIES.filter(negative => positives.every(positive => personalitiesCompatible(negative,positive)));
      if (!compatibleCandidates.length) throw new Error("没有与当前性格兼容的负面特质");
      const baseCandidates = compatibleCandidates;
      const first = pick(baseCandidates);
      const selected = [first];
      if (Math.random() < .5) {
        const secondCandidates = baseCandidates.filter(negative => negative !== first && personalitiesCompatible(first,negative));
        if (secondCandidates.length) selected.push(pick(secondCandidates));

      state.values.negativePersonality = selected.map(tag => tag.label).join(" × ");

    function basicColorFromHex(hex) {
      const value = String(hex || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(value)) return "";
      const [r,g,b] = [0,2,4].map(offset => parseInt(value.slice(offset,offset + 2),16) / 255);
      const max = Math.max(r,g,b);
      const min = Math.min(r,g,b);
      const delta = max - min;
      const lightness = (max + min) / 2;
      if (delta < .09) return lightness > .82 ? "white" : lightness < .2 ? "black" : "grey";
      let hue;
      if (max === r) hue = ((g - b) / delta) % 6;
      else if (max === g) hue = (b - r) / delta + 2;
      else hue = (r - g) / delta + 4;
      hue = (hue * 60 + 360) % 360;
      if (lightness < .38 && (hue < 45 || hue > 345)) return "brown";
      if (hue < 15 || hue >= 345) return lightness > .68 ? "pink" : "red";
      if (hue < 45) return "orange";
      if (hue < 70) return "yellow";
      if (hue < 165) return "green";
      if (hue < 195) return "teal";
      if (hue < 255) return "blue";
      if (hue < 290) return "purple";
      return lightness > .62 ? "pink" : "purple";
    }

    async function writeClipboard(text) {
      try {

      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
    }

      if (!state.values.name) return showToast("请先生成一份人设");
      const prompts = buildImagePrompts();
      const structured = PROMPT_PRESETS[state.promptPreset]?.format === "structured-brief";
      const text = kind === "positive"
        ? prompts.positive
        : kind === "negative"
          ? prompts.negative
          : structured
            ? `${prompts.positive}\n\n${prompts.negative}`
            : `Positive prompt:\n${prompts.positive}\n\nNegative prompt:\n${prompts.negative}`;
      await writeClipboard(text);
      showToast(kind === "all"
        ? structured ? "完整 GPT Image 提示词已复制" : "正向与负向提示词已复制"
        : `${structured ? kind === "positive" ? "图像描述" : "约束条件" : kind === "positive" ? "正向" : "负向"}已复制`);
    }

    function downloadJson() {
      if (!state.values.name) return showToast("请先生成一份人设");
      const payload = {
        version:"modern-v1.6", gender:"female", adult:true, generatedAt:new Date().toISOString(),
        filters:state.filters,
        character:Object.fromEntries(FIELDS.filter(fieldEnabled).map(field => [field.key,{value:state.values[field.key],detail:state.meta[field.key] || null,colors:state.swatches[field.key] || []}])),
        summary:document.querySelector("#summaryValue").textContent,
        imagePrompt:buildImagePrompts()
      };
      const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `modern-character-${Date.now()}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("JSON 已导出");
    }

    function persist() {
      const serializableMeta = {...state.meta};
      delete serializableMeta.bodyConfig;
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        values:state.values, meta:serializableMeta, swatches:state.swatches,
        locked:[...state.locked], rollCount:state.rollCount, filters:state.filters, promptPreset:state.promptPreset
      }));
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return;
        state.values = saved.values || {};
        state.meta = saved.meta || {};
        delete state.meta.body;
        state.swatches = saved.swatches || {};
        state.locked = new Set(saved.locked || []);
        state.rollCount = Number(saved.rollCount) || 0;
        state.filters = {...state.filters,...(saved.filters || {})};
        state.filters.finishingMode = state.filters.finishingMode === "independent" ? "independent" : "linked";
        state.filters.personalityCount = ["random","1","2","3"].includes(String(state.filters.personalityCount)) ? String(state.filters.personalityCount) : "random";
        ["negativePersonality","bodyFeatures","healthConditions"].forEach(key => {
          state.filters[key] = state.filters[key] === true;
        });
        normalizeHeightRange();
        updateFinishingLockDependency();
        state.promptPreset = PROMPT_PRESETS[saved.promptPreset] ? saved.promptPreset : "novelai";
        delete state.values.hairStyle;
        delete state.meta.hairStyle;
        state.locked.delete("hairStyle");
        if (state.values.name && (!state.values.backHair || !state.values.frontHair)) {
          if (!state.meta.hairLengthKey) generateHairLength();
          generateBackHair();
          generateFrontHair();
        }
        if (state.values.name && !state.values.personality) generatePersonality();
        if (state.values.name && state.filters.negativePersonality && !state.values.negativePersonality) generateNegativePersonality();
        if (state.values.name && state.filters.bodyFeatures && !state.values.bodyFeatures) generateBodyFeatures();
        if (state.values.name && state.filters.healthConditions && !state.values.healthConditions) generateHealthConditions();
        persist();
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"),1600);
    }

    document.querySelector("#rollAll").addEventListener("click",rollAllFields);
    document.querySelector("#unlockAll").addEventListener("click",unlockAll);
    document.querySelector("#copyText").addEventListener("click",copyText);
    document.querySelector("#downloadJson").addEventListener("click",downloadJson);

    buildControls();
    buildCards();
    restore();
    updateControls();
    renderAll(false);
  </script>
</body>
</html>
