      --muted: #aaa9b5;
      --line: rgba(255, 255, 255, .1);

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    button { font: inherit; }
    .shell { width: min(1160px, calc(100% - 32px)); margin: 0 auto; padding: 58px 0 76px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--gold); font-size: 12px; font-weight: 900; letter-spacing: .17em; text-transform: uppercase; }

    .subtitle { max-width: 680px; margin: 17px 0 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .version-badge { flex: 0 0 auto; padding: 10px 14px; border: 1px solid rgba(241,200,108,.28); border-radius: 999px; color: var(--gold); background: rgba(241,200,108,.07); font-size: 12px; font-weight: 800; }

    .settings { margin-bottom: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.035); }

    .settings-title { margin: 0; font-size: 14px; }
    .adult-note { color: var(--muted); font-size: 12px; }
    .control-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .control { min-width: 0; }
    .control.wide { grid-column: 1 / -1; }
    .control-label { display: block; margin: 0 0 8px 2px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .segments { display: flex; flex-wrap: wrap; gap: 7px; }

    .toolbar { position: sticky; top: 10px; z-index: 10; display: flex; flex-wrap: wrap; gap: 9px; padding: 13px; border: 1px solid var(--line); border-radius: 18px; background: rgba(18,19,25,.88); box-shadow: 0 10px 40px rgba(0,0,0,.25); backdrop-filter: blur(18px); }
    .button { min-height: 43px; padding: 0 16px; border: 1px solid var(--line); border-radius: 11px; color: var(--text); background: var(--panel-2); cursor: pointer; transition: transform .18s ease, border-color .18s ease; }
    .button:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.24); }
    .button:focus-visible, .icon-button:focus-visible, .segment:focus-visible { outline: 3px solid rgba(241,200,108,.32); outline-offset: 2px; }
    .button.primary { color: #21130e; border-color: transparent; background: linear-gradient(135deg, var(--gold), var(--accent)); font-weight: 900; }
    .button.ghost { background: transparent; }
    .spacer { flex: 1; }
    .counter { display: flex; align-items: center; padding: 0 8px; color: var(--muted); font-size: 12px; }
    .counter strong { margin-left: 5px; color: var(--text); font-size: 16px; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 17px; }
    .card { position: relative; min-height: 168px; padding: 21px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); transition: border-color .2s ease, transform .2s ease; }
    .card:hover { border-color: rgba(255,255,255,.2); transform: translateY(-2px); }
    .card.locked { border-color: rgba(241,200,108,.46); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .step { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .1em; }
    .card-actions { display: flex; gap: 6px; }
    .icon-button { width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: transparent; cursor: pointer; }
    .icon-button:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,.06); }
    .icon-button:disabled { cursor: not-allowed; opacity: .32; }
    .icon-button[aria-pressed="true"] { color: var(--gold); background: rgba(241,200,108,.1); }
    .value { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(21px, 2.8vw, 29px); line-height: 1.42; }
    .meta { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .swatch { width: 18px; height: 18px; border: 1px solid rgba(255,255,255,.32); border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.18); }
    .summary { grid-column: 1 / -1; min-height: auto; background: linear-gradient(135deg, rgba(255,121,91,.12), rgba(241,200,108,.055)); }
    .summary .value { font-size: clamp(17px, 2vw, 23px); line-height: 1.75; }
    .prompt-card { grid-column: 1 / -1; min-height: auto; }
    .prompt-head { align-items: flex-start; }
    .prompt-title { display: grid; gap: 6px; }
    .prompt-note { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; line-height: 1.55; }
    .prompt-select { min-height: 38px; padding: 0 34px 0 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); font: inherit; cursor: pointer; }
    .prompt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .prompt-block { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(0,0,0,.16); }
    .prompt-block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .prompt-block-title { color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .08em; }
    .prompt-copy { min-height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; cursor: pointer; }
    .prompt-copy:hover { color: var(--text); border-color: rgba(255,255,255,.24); }
    .prompt-output { width: 100%; min-height: 190px; padding: 0; resize: vertical; border: 0; outline: 0; color: #e9e5dc; background: transparent; font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .prompt-footer { display: flex; justify-content: flex-end; margin-top: 12px; }

    .toast { position: fixed; left: 50%; bottom: 26px; z-index: 30; padding: 11px 16px; border: 1px solid rgba(120,212,167,.35); border-radius: 999px; color: var(--success); background: #171b1b; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: .2s ease; }

    footer { margin-top: 23px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7; }

      .prompt-select { width: 100%; }
      .toolbar { top: 5px; }
      .button { flex: 1 1 auto; }
      .spacer { display: none; }
      .counter { width: 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

      const typeLabels = {separates:"上下装",dress:"连衣裙",jumpsuit:"连体装",layered:"叠穿"};
      state.values.outfit = `${profile.style} · ${profile.main}`;
      state.meta.outfit = `${typeLabels[typeKey]} · ${colors[0]} + ${colors[1]}`;
      state.swatches.outfit = [colors[2],colors[3]];
      state.meta.outfitProfile = profile;
    }

    function generateFinishing() {
      let profile = state.meta.outfitProfile;
      if (!profile) {
        const typeKey = pick(Object.keys(OUTFITS));
        profile = pick(OUTFITS[typeKey]);
        state.meta.outfitProfile = profile;
      }
      const [accessoryA,accessoryB] = pickTwoDistinct(profile.accessories);
      state.values.finishing = `${pick(profile.shoes)} · ${pick(profile.socks)}`;
      state.meta.finishing = `配饰：${accessoryA} + ${accessoryB}`;
    }

    function personalitiesCompatible(a,b) {
      return !a.conflicts.includes(b.key) && !b.conflicts.includes(a.key);
    }

    function generatePersonality() {
      const base = pick(PERSONALITY_LAYERS.temperament);
      const expressions = PERSONALITY_LAYERS.expression.filter(tag => personalitiesCompatible(base,tag));
      const expression = pick(expressions);
      const selected = [base,expression];
      if (Math.random() < .62) {
        const accents = PERSONALITY_LAYERS.accent.filter(tag => selected.every(other => personalitiesCompatible(other,tag)));
        if (accents.length) selected.push(pick(accents));
      }
      state.values.personality = selected.map(tag => tag.label).join(" × ");
      state.meta.personality = selected.map(tag => tag.detail).join("；");
      state.meta.personalityKeys = selected.map(tag => tag.key);
    }

    const GENERATORS = {
      name:generateName, body:generateBody, hairColor:generateHairColor, hairLength:generateHairLength,
      hairStyle:generateHairStyle, eyes:generateEyes, measurements:generateMeasurements,
      skin:generateSkin, outfit:generateOutfit, finishing:generateFinishing, personality:generatePersonality
    };

    function rollAllFields() {
      if (!state.locked.has("name")) generateName();
      if (!state.locked.has("body")) generateBody();
      if (!state.locked.has("hairColor")) generateHairColor();
      if (!state.locked.has("hairLength")) generateHairLength();
      if (!state.locked.has("hairStyle")) generateHairStyle();
      if (!state.locked.has("eyes")) generateEyes();
      if (!state.locked.has("measurements")) generateMeasurements();
      if (!state.locked.has("skin")) generateSkin();
      if (!state.locked.has("outfit")) generateOutfit();
      if (!state.locked.has("finishing")) generateFinishing();
      if (!state.locked.has("personality")) generatePersonality();
      state.rollCount += 1;
      renderAll(true);
      persist();
    }

    function rerollField(key) {
      if (state.locked.has(key)) return;
      GENERATORS[key]();
      if (key === "body" && !state.locked.has("measurements")) generateMeasurements();
      if (key === "hairLength" && !state.locked.has("hairStyle")) generateHairStyle();
      if (key === "outfit" && !state.locked.has("finishing")) generateFinishing();
      renderAll(true);
      persist();
    }

    function toggleLock(key) {
      if (state.locked.has(key)) {
        state.locked.delete(key);
      } else {
        state.locked.add(key);
        if (key === "hairStyle") state.locked.add("hairLength");
        if (key === "measurements") state.locked.add("body");
        if (key === "finishing") state.locked.add("outfit");
      }
      renderAll(false);
      persist();
    }

    function unlockAll() {
      state.locked.clear();
      renderAll(false);
      persist();
      showToast("已全部解锁");
    }

    function renderAll(animate=false) {
      rollCount.textContent = state.rollCount;
      FIELDS.forEach(field => renderCard(field.key,animate));
      updateSummary();
    }

    function renderCard(key,animate) {
      const card = grid.querySelector(`[data-key="${key}"]`);
      if (!card) return;
      card.querySelector(".value").textContent = state.values[key] || "等待抽取……";
      const meta = card.querySelector(".meta");
      meta.textContent = state.meta[key] || "";
      meta.hidden = !state.meta[key];
      const swatches = card.querySelector(".swatches");
      swatches.replaceChildren();
      (state.swatches[key] || []).forEach(hex => {
        const dot = document.createElement("span");
        dot.className = "swatch";
        dot.style.backgroundColor = hex;
        dot.title = hex;
        dot.setAttribute("aria-label", `色号 ${hex}`);
        swatches.append(dot);
      });
      const locked = state.locked.has(key);
      card.classList.toggle("locked",locked);
      const lock = card.querySelector(".lock");
      lock.setAttribute("aria-pressed",String(locked));
      lock.textContent = locked ? "◆" : "◇";
      lock.title = locked ? "解锁此项" : "锁定此项";
      card.querySelector(".reroll").disabled = locked;
      if (animate && state.values[key]) {
        card.classList.remove("flash");
        requestAnimationFrame(() => card.classList.add("flash"));
      }
    }

    function uniqueTags(tags) {
      return [...new Set(tags.filter(Boolean).map(tag => tag.trim()).filter(Boolean))];
    }

    function basicColorFromHex(hex) {
      const value = String(hex || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(value)) return "";
      const [r,g,b] = [0,2,4].map(offset => parseInt(value.slice(offset,offset + 2),16) / 255);
      const max = Math.max(r,g,b);
      const min = Math.min(r,g,b);
      const delta = max - min;
      const lightness = (max + min) / 2;
      if (delta < .09) return lightness > .82 ? "white" : lightness < .2 ? "black" : "grey";
      let hue;
      if (max === r) hue = ((g - b) / delta) % 6;
      else if (max === g) hue = (b - r) / delta + 2;
      else hue = (r - g) / delta + 4;
      hue = (hue * 60 + 360) % 360;
      if (lightness < .38 && (hue < 45 || hue > 345)) return "brown";
      if (hue < 15 || hue >= 345) return lightness > .68 ? "pink" : "red";
      if (hue < 45) return "orange";
      if (hue < 70) return "yellow";
      if (hue < 165) return "green";
      if (hue < 195) return "teal";
      if (hue < 255) return "blue";
      if (hue < 290) return "purple";
      return lightness > .62 ? "pink" : "purple";
    }

    function hairStylePromptTags(style) {
      const tags = [];
      if (style.includes("水母头")) tags.push("jellyfish cut");
      else if (style.includes("姬发式")) tags.push("hime cut");
      else if (style.includes("狼尾")) tags.push("wolf cut");
      else if (style.includes("波波头")) tags.push("bob cut");
      else if (style.includes("蘑菇头")) tags.push("bowl cut");
      if (style.includes("双马尾")) tags.push("twintails");
      else if (style.includes("侧马尾")) tags.push("side ponytail");
      else if (style.includes("马尾")) tags.push("ponytail");
      if (style.includes("双丸子") || style.includes("双团子")) tags.push("double buns");
      else if (style.includes("丸子") || style.includes("团子")) tags.push("hair bun");
      if (style.includes("双麻花辫") || style.includes("双股编发")) tags.push("twin braids");
      else if (style.includes("辫") || style.includes("编发")) tags.push("braid");
      if (style.includes("盘发")) tags.push("hair updo");
      if (style.includes("半扎")) tags.push("half updo");
      if (style.includes("大波浪") || style.includes("水波纹") || style.includes("人鱼卷") || style.includes("蝴蝶卷")) tags.push("wavy hair");
      else if (style.includes("卷")) tags.push("curly hair");
      if (style.includes("直发") || style.includes("一刀切") || style.includes("顺直")) tags.push("straight hair");
      if (style.includes("齐刘海")) tags.push("blunt bangs");
      if (style.includes("侧分")) tags.push("side-parted hair");
      if (style.includes("中分")) tags.push("center-parted hair");
      if (style.includes("露耳") || style.includes("挂耳")) tags.push("hair behind ear");
      if (style.includes("外翘")) tags.push("flipped hair");
      if (style.includes("呆毛")) tags.push("ahoge");
      if (style.includes("不对称")) tags.push("asymmetrical hair");
      return uniqueTags(tags.length ? tags : ["styled hair"]);
    }

    function footwearPrompt(text) {
      const rules = [
        ["茶会","tea party shoes"], ["摇摇鞋","rocking horse shoes"], ["玛丽珍","mary janes"], ["乐福","loafers"],

    function socksPrompt(text) {
      const rules = [
        ["不搭配袜类","bare legs"], ["过膝袜","thighhighs"], ["及膝袜","knee socks"], ["及膝罗纹袜","knee socks"],

    function accessoryPrompt(text) {
      const rules = [
        ["电子目镜","visor"], ["护目镜","goggles"], ["太阳镜","sunglasses"], ["墨镜","sunglasses"], ["眼镜","glasses"],
        ["面罩","face mask"], ["耳机","headphones"], ["耳罩","earmuffs"], ["手套","gloves"], ["登山扣","carabiner"],
        ["头饰","headdress"], ["星冠","mini tiara"], ["发箍","headband"], ["发夹","hairclip"], ["发簪","hairpin"],
        ["发带","hair ribbon"], ["发饰","hair ornament"], ["帽","hat"], ["头巾","headscarf"], ["方巾","neckerchief"], ["围巾","scarf"],

        ["项链","necklace"], ["锁骨链","necklace"], ["颈链","choker"], ["颈饰","choker"], ["颈环","choker"], ["耳环","earrings"],

        ["耳钉","earrings"], ["耳坠","earrings"], ["耳饰","earrings"], ["耳挂","ear cuff"], ["腕表","wristwatch"],
        ["腕饰","bracelet"], ["腕带","bracelet"], ["手镯","bangle"], ["手环","bracelet"], ["臂带","armband"], ["臂环","armband"],
        ["腰链","waist chain"], ["裤链","pants chain"], ["腰封","waist belt"], ["腰带","belt"], ["戒","rings"], ["胸针","brooch"],
        ["徽章","badge"], ["贴纸","face stickers"], ["挂件","charms"], ["钥匙扣","keychains"], ["扣带","straps"],
        ["手包","handbag"], ["托特包","tote bag"], ["挎包","shoulder bag"], ["肩包","shoulder bag"], ["方包","handbag"],
        ["痛包","ita bag"], ["小包","small bag"], ["腰包","waist bag"], ["邮差包","messenger bag"], ["包","bag"], ["伞","umbrella"]

      return (rules.find(([needle]) => text.includes(needle)) || [null,""])[1];

    function buildCharacterPromptTags() {
      const tags = ["1girl", "solo", "adult woman", "full body", "standing", "looking at viewer", "fully clothed"];
      const bodyKey = state.meta.bodyTypeKey;
      const bodyTags = { petite:["petite", "slim"], youthful:["slender"], mature:["mature female", "curvy"] };
      tags.push(...(bodyTags[bodyKey] || []));

      const heightMatch = String(state.values.measurements || "").match(/身高\s*(\d+)/);
      if (heightMatch && Number(heightMatch[1]) >= 169) tags.push("tall female");

      const lengthTags = { pixie:"very short hair", short:"short hair", medium:"medium hair", long:"long hair", extra:"very long hair" };
      tags.push(lengthTags[state.meta.hairLengthKey]);
      tags.push(...hairStylePromptTags(state.values.hairStyle || ""));

      const hairParts = String(state.values.hairColor || "").split(" · ");
      if (state.meta.hairColor === "纯色") {
        const color = COLOR_PROMPTS[hairParts[0]];
        if (color) tags.push(`${color} hair`);
      } else if (hairParts.length > 1) {
        const [base,accent] = hairParts[1].split(" + ");
        if (COLOR_PROMPTS[base]) tags.push(`${COLOR_PROMPTS[base]} hair`);
        if (COLOR_PROMPTS[accent]) tags.push(`${COLOR_PROMPTS[accent]} highlights`);
        tags.push(DYE_PROMPTS[hairParts[0]]);
      }

      const eyeValue = String(state.values.eyes || "");
      if (eyeValue.startsWith("异色瞳")) {
        tags.push("heterochromia");
        const match = eyeValue.match(/左(.+?)\s*\/\s*右(.+)$/);
        if (match) {
          if (COLOR_PROMPTS[match[1]]) tags.push(`${COLOR_PROMPTS[match[1]]} left eye`);
          if (COLOR_PROMPTS[match[2]]) tags.push(`${COLOR_PROMPTS[match[2]]} right eye`);
        }
      } else {
        const eyeName = eyeValue.split("瞳")[0];
        if (COLOR_PROMPTS[eyeName]) tags.push(`${COLOR_PROMPTS[eyeName]} eyes`);
      }

      const skinTags = { "瓷白":"pale skin", "冷白":"fair skin", "暖白":"fair skin", "自然肤色":"light tan skin", "蜜糖色":"tan skin", "小麦色":"tan skin", "深棕肤色":"dark skin" };
      tags.push(skinTags[state.values.skin]);

      const outfitMain = String(state.values.outfit || "").split(" · ").slice(1).join(" · ");
      tags.push(...(OUTFIT_PROMPTS[outfitMain] || ["modern clothes"]));
      const outfitColors = uniqueTags((state.swatches.outfit || []).map(basicColorFromHex));
      if (outfitColors.length) tags.push(`${outfitColors.join(" and ")} color scheme`);

      const [shoes,socks] = String(state.values.finishing || "").split(" · ");
      tags.push(footwearPrompt(shoes || ""), socksPrompt(socks || ""));
      const accessories = String(state.meta.finishing || "").replace(/^配饰：/, "").split(" + ");
      tags.push(...accessories.map(accessoryPrompt));
      (state.meta.personalityKeys || []).forEach(key => tags.push(...(PERSONALITY_PROMPTS[key] || [])));
      return uniqueTags(tags);
    }

    function buildImagePrompts() {
      const preset = PROMPT_PRESETS[state.promptPreset] || PROMPT_PRESETS.novelai;
      const characterTags = buildCharacterPromptTags();
      const positiveTags = state.promptPreset === "animagine"
        ? [...characterTags, ...preset.suffix, ...preset.prefix]
        : [...preset.prefix, ...characterTags, ...preset.suffix];
      return {
        preset: preset.label,
        positive: uniqueTags(positiveTags).join(", "),
        negative: uniqueTags(preset.negative).join(", ")
      };
    }

    function renderPrompt() {
      const preset = document.querySelector("#promptPreset");
      const positive = document.querySelector("#positivePrompt");
      const negative = document.querySelector("#negativePrompt");
      if (!preset || !positive || !negative) return;
      preset.value = PROMPT_PRESETS[state.promptPreset] ? state.promptPreset : "novelai";
      if (!state.values.name) {
        positive.value = "生成一份人设后，这里会自动整理正向提示词。";
        negative.value = "生成一份人设后，这里会自动整理负向提示词。";
        return;
      }
      const prompts = buildImagePrompts();
      positive.value = prompts.positive;
      negative.value = prompts.negative;
    }

    function updateSummary() {
      const summary = document.querySelector("#summaryValue");
      if (!state.values.name) {
        summary.textContent = "设置偏好后，点击“Roll 完整人设”。";
        renderPrompt();
        return;
      }
      summary.textContent = `${state.values.name}，成年女性，${state.values.body}。${state.values.hairLength}，${state.values.hairStyle}，发色为${state.values.hairColor}；${state.values.eyes}，${state.values.skin}。身着${state.values.outfit}，搭配${state.values.finishing}。性格是${state.values.personality}。`;
      renderPrompt();
    }

    function formatText() {
      const lines = ["# 现代女性人设 v1.2", "", "- 性别：女性", "- 年龄范围：18+成年"];
      FIELDS.forEach(field => {
        lines.push(`- ${field.label.slice(5)}：${state.values[field.key] || "未生成"}${state.meta[field.key] ? `（${state.meta[field.key]}）` : ""}`);
      });
      lines.push("", `> ${document.querySelector("#summaryValue").textContent}`);
      const prompts = buildImagePrompts();
      lines.push("", `## 绘图提示词（${prompts.preset}）`, "", "### 正向", prompts.positive, "", "### 负向", prompts.negative);
      return lines.join("\n");
    }

    async function writeClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
    }

    async function copyText() {
      if (!state.values.name) return showToast("请先生成一份人设");
      await writeClipboard(formatText());
      showToast("人设已复制");
    }

    async function copyPrompt(kind) {
      if (!state.values.name) return showToast("请先生成一份人设");
      const prompts = buildImagePrompts();
      const text = kind === "positive"
        ? prompts.positive
        : kind === "negative"
          ? prompts.negative
          : `Positive prompt:\n${prompts.positive}\n\nNegative prompt:\n${prompts.negative}`;
      await writeClipboard(text);
      showToast(kind === "all" ? "正向与负向提示词已复制" : `${kind === "positive" ? "正向" : "负向"}提示词已复制`);
    }

    function downloadJson() {
      if (!state.values.name) return showToast("请先生成一份人设");
      const payload = {
        version:"modern-v1.2", gender:"female", adult:true, generatedAt:new Date().toISOString(),
        filters:state.filters,
        character:Object.fromEntries(FIELDS.map(field => [field.key,{value:state.values[field.key],detail:state.meta[field.key] || null,colors:state.swatches[field.key] || []}])),
        summary:document.querySelector("#summaryValue").textContent,
        imagePrompt:buildImagePrompts()
      };
      const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `modern-character-${Date.now()}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("JSON 已导出");
    }

    function persist() {
      const serializableMeta = {...state.meta};
      delete serializableMeta.bodyConfig;
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        values:state.values, meta:serializableMeta, swatches:state.swatches,
        locked:[...state.locked], rollCount:state.rollCount, filters:state.filters, promptPreset:state.promptPreset
      }));
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return;
        state.values = saved.values || {};
        state.meta = saved.meta || {};
        delete state.meta.body;
        state.swatches = saved.swatches || {};
        state.locked = new Set(saved.locked || []);
        state.rollCount = Number(saved.rollCount) || 0;
        state.filters = {...state.filters,...(saved.filters || {})};
        state.promptPreset = PROMPT_PRESETS[saved.promptPreset] ? saved.promptPreset : "novelai";
        if (state.values.name && !state.values.personality) generatePersonality();
        persist();
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"),1600);
    }

    document.querySelector("#rollAll").addEventListener("click",rollAllFields);
    document.querySelector("#unlockAll").addEventListener("click",unlockAll);
    document.querySelector("#copyText").addEventListener("click",copyText);
    document.querySelector("#downloadJson").addEventListener("click",downloadJson);

    buildControls();
    buildCards();
    restore();
    updateControls();
    renderAll(false);
  </script>
</body>
